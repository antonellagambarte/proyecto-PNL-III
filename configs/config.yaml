# Configuración del sistema.
# Las credenciales (OPENAI_API_KEY) van en el .env, nunca en este archivo.
# Las rutas relativas se toman desde la raíz del proyecto.

llm:
  modelo: gpt-6-luna
  timeout_segundos: 60
  reintentos: 2             # si OpenAI falla o no responde a tiempo, se reintenta antes de dar error

agentes:
  max_vueltas: 2            # vueltas máximas entre tutor y verificador
  max_busquedas: 2          # búsquedas del tutor en cada vuelta: una y, si no alcanza, otra con otras palabras

memoria:
  max_tokens: 768           # cuando la charla anterior pasa de este tamaño, se resume
  max_tokens_resumen: 512   # lugar reservado para el resumen dentro de los max_tokens (no limita su largo)

entrada:
  max_caracteres: 1000      # Largo máximo de la pregunta: si lo pasa, se rechaza sin llamar al LLM.

pantalla:
  url_api: http://127.0.0.1:8000   # dónde escucha la API: esta misma máquina y el puerto que usa uvicorn por defecto

busqueda:
  modelo_embeddings: intfloat/multilingual-e5-small              # búsqueda por significado
  modelo_reranking: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1   # reordena los candidatos
  max_por_seccion: 3        # chunks de una misma sección en los resultados, después del re-ranking (con 2, Recall@5 0,950; con 3, 0,975)
  k_candidatos: 30          # candidatos de la búsqueda híbrida, antes del re-ranking
  k_fragmentos: 5           # fragmentos que recibe el tutor, después del re-ranking

chunks:
  max_tokens: 200
  solapamiento: 60

evaluacion:
  ks: [5, 10]               # fragmentos que se miran al calcular las métricas (el tutor recibe 5)

rutas:
  manual_pdf: data/raw/manual_del_conductor.pdf
  transcripciones: data/raw/tablas_transcriptas.json   # tablas del manual transcriptas a mano
  cuestionario: data/raw/cuestionario.pdf              # preguntas oficiales del examen teórico
  intermedios: data/interim
  procesados: data/processed
  indices: data/indices
  reportes: reports
  logs: logs

logging:
  nivel: INFO
